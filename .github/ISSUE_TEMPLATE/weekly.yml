name: 주차별 문제 공지
description: 이번 주 풀어올 문제를 공지합니다. (운영진용)
title: "[week00] 문제 공지"
labels: ["공지"]
body:
  - type: input
    id: week
    attributes:
      label: 주차 / 날짜
      placeholder: "week01 · 09/09(수)"
    validations:
      required: true

  - type: input
    id: topic
    attributes:
      label: 주제
      placeholder: "그리디 (3장)"

  - type: textarea
    id: problems
    attributes:
      label: 문제 목록
      placeholder: |
        1. 1-2 큰 수의 법칙
        2. 1-3 숫자 카드 게임
        3. 1-4 1이 될 때까지
    validations:
      required: true

  - type: input
    id: presenter
    attributes:
      label: 발표자
      placeholder: "전체 발표 1명"

  - type: input
    id: deadline
    attributes:
      label: 제출 마감
      placeholder: "화요일 24:00 까지 PR"
